<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Video Downloader</title>
  </head>

  <body>

    <div id="compress-section">

      <div class="topBottomPadding darkColorBg">
        <p>Current</p>
        <div class="input-container">
          <span id="current-mb-display">00</span>
          <span>MB</span>
        </div>
      </div>
    
      <label id="customInputLabel" class="radio-btn">
        <input type="radio" name="size-group" value="custom">
        <div class="topBottomPadding radio-content">
          <p>Custom</p>
          <div class="input-container">
            <input type="number" id="custom-mb-input" oninput="if(this.value.length > 2) this.value = this.value.slice(0, 2);" max="99">
            <span>MB</span>
          </div>
        </div>
      </label>

      
      <div id="preset-container">
        <label class="radio-btn">
          <input type="radio" name="size-group" value="50">
          <div class="topBottomPadding radio-content"><span>50</span><span>MB</span></div>
        </label>
        
        <label class="radio-btn">
          <input type="radio" name="size-group" value="25">
          <div class="topBottomPadding radio-content"><span>25</span><span>MB</span></div>
        </label>
        
        <label class="radio-btn">
          <input type="radio" name="size-group" value="10">
          <div class="topBottomPadding radio-content"><span>10</span><span>MB</span></div>
        </label>
      </div>
      
    </div>



    <div id="main-section">

        <div id="download-section">
          <input id="link-input" class="press-start-2p-regular" type="text" placeholder="Insert link" autofocus/>
        </div>

      <div id="video-section">
        
        <div id="video-wrapper">
          <div id="video-container" style="display: none;">
            <video id="video-preview" muted loop autoplay controls></video>
            <div id="crop-area-div"></div>

          </div>

          <div id="download-icon" class="lds-ellipsis"><div></div><div></div><div></div><div></div></div>
          
          <p id="drop-here" class="press-start-2p-regular">[ DROP ]</p>

        </div>

      </div>


      <div id="cropping-controls">
        <div id="slider-div">
          <div id="slider-track"></div>
          <div id="slider-track-bg"></div>
          <input type="range" min="0" max="1000" value="0" id="slider-1">
          <input type="range" min="0" max="1000" value="1000" id="slider-2">
        </div>
        <div id="timeboxes-div">
          <input id="timeStartBox" class="timeBox" type="text" placeholder="MM:SS:ms" pattern="[0-9]{2}:[0-5][0-9]" readonly >
          <input id="timeEndBox" class="timeBox" type="text" placeholder="MM:SS:ms" pattern="[0-9]{2}:[0-5][0-9]" readonly >
        </div>
      </div>


    </div>


    <div id="pipeline-wrapper">
      <div id="pipeline-container">
          <div id="pipeline-bar"></div>

          <!-- Not in use
          <div id="pipe-step-div-text">
            <label>Download</label>
            <label>Crop</label>
            <label>Ratio</label>
            <label>Compress</label>
            <label>Done</label>
          </div>-->

          <div id="pipe-step-div">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
          </div>

      </div>
    </div>



    <div id="done-container">
      <input id="apply-button" type="button" value="Save" class="press-start-2p-regular" disabled />
    </div>

    


    <!-- CSS -->
    <link rel="stylesheet" href="index.css" />

    <!-- FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">

    <!-- Scripts -->
    <script src="scripts/main.js"></script>
    <script src="scripts/download.js"></script>
    <script src="scripts/crop.js"></script>
    <script src="scripts/ratio.js"></script>
    <script src="scripts/compress.js"></script>
    <script src="scripts/clean.js"></script>
    <script src="scripts/dropBox.js"></script>
    <script src="scripts/ui-tools.js"></script>
  </body>
</html>
